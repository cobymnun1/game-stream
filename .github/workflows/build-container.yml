name: Build game-stream container

# Builds the BaseHack game-stream image (SteamOS web desktop + Sunshine) and
# pushes it to GitHub Container Registry (ghcr.io). No local Docker needed —
# this runs in CI. Trigger manually or on changes to the Dockerfile.

on:
  workflow_dispatch: {}
  push:
    branches: [demo, main]
    paths:
      - "infra/docker/**"
      - ".github/workflows/build-container.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/game-stream:latest
            ghcr.io/${{ github.repository_owner }}/game-stream:${{ github.sha }}
