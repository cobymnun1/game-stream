<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Moonlight Auto-Connect</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #stream-canvas {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #status-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 320px;
      text-align: center;
    }

    #status-panel h1 {
      font-size: 1.4rem;
      font-weight: 600;
    }

    #status {
      font-size: 0.9rem;
      color: #888;
      min-height: 1.2em;
    }

    #error {
      font-size: 0.85rem;
      color: #e55;
      min-height: 1.2em;
      white-space: pre-wrap;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #333;
      border-top-color: #1a6ef5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="stream-canvas"></canvas>

  <div id="status-panel">
    <h1>Moonlight Auto-Connect</h1>
    <div class="spinner" id="spinner"></div>
    <div id="status">Waiting for pairing confirmation...</div>
    <div id="error"></div>
  </div>

  <script type="module" src="/src/auto.ts"></script>
</body>
</html>
